name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v4
        with:
          # Install exactly what the build needs instead of relying on the
          # runner image's preinstalled SDK.
          packages: platform-tools platforms;android-35 build-tools;35.0.0

      - uses: gradle/actions/setup-gradle@v6

      # Always the wrapper: it pins Gradle 8.9, which AGP 8.7.3 requires.
      - name: Assemble library and example app
        run: |
          set -o pipefail
          ./gradlew :soniq-base:assembleDebug :examples:youtube-music:assembleDebug \
              --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Run JVM unit tests
        run: |
          set -o pipefail
          ./gradlew :soniq-base:testDebugUnitTest --no-daemon --stacktrace 2>&1 | tee test.log

      # Job logs are not reachable from every environment that maintains this
      # repository; repeat the error summary as annotations so it is visible
      # through the checks API.
      - name: Surface Gradle errors as annotations
        if: failure()
        run: |
          {
            grep -hE '^e: |What went wrong|Execution failed|Caused by|error:|FAILURE:' build.log test.log 2>/dev/null || true
            grep -h -A12 'What went wrong' build.log test.log 2>/dev/null || true
          } | head -60 | while IFS= read -r line; do echo "::error title=gradle::$line"; done

      - name: Upload example APK
        uses: actions/upload-artifact@v7
        with:
          name: soniq-youtube-music-example-debug
          path: examples/youtube-music/build/outputs/apk/debug/*.apk

      - name: Upload library AAR
        uses: actions/upload-artifact@v7
        with:
          name: soniq-base-debug-aar
          path: soniq-base/build/outputs/aar/*.aar

  # Push a tag like v0.1.0 to publish that version to GitHub Packages.
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0

      - uses: gradle/actions/setup-gradle@v6

      - name: Publish :soniq-base
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          ./gradlew :soniq-base:publish --no-daemon --stacktrace
          -PsoniqVersion="${GITHUB_REF_NAME#v}"
