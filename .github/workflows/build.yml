name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v4
        with:
          # Install exactly what the build needs instead of relying on the
          # runner image's preinstalled SDK.
          packages: platform-tools platforms;android-35 build-tools;35.0.0

      - uses: gradle/actions/setup-gradle@v6

      # Always the wrapper: it pins Gradle 8.9, which AGP 8.7.3 requires.
      - name: Assemble library and example app
        run: ./gradlew :soniq-base:assembleDebug :examples:youtube-music:assembleDebug --no-daemon --stacktrace

      - name: Run JVM unit tests
        run: ./gradlew :soniq-base:testDebugUnitTest --no-daemon --stacktrace

      - name: Upload example APK
        uses: actions/upload-artifact@v7
        with:
          name: soniq-youtube-music-example-debug
          path: examples/youtube-music/build/outputs/apk/debug/*.apk

      - name: Upload library AAR
        uses: actions/upload-artifact@v7
        with:
          name: soniq-base-debug-aar
          path: soniq-base/build/outputs/aar/*.aar

  # Push a tag like v0.1.0 to publish that version to GitHub Packages.
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0

      - uses: gradle/actions/setup-gradle@v6

      - name: Publish :soniq-base
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          ./gradlew :soniq-base:publish --no-daemon --stacktrace
          -PsoniqVersion="${GITHUB_REF_NAME#v}"
