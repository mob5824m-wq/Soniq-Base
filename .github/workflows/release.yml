# Pushing a vX.Y.Z tag is the whole release (scripts/release.py does the
# tagging): build + tests, publish com.soniq.base:soniq-base to GitHub Packages,
# then create the GitHub Release with the changelog as notes and the AAR,
# sources JAR and example APK attached.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the GitHub Release and upload assets
      packages: write   # publish to GitHub Packages
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # the module versions are derived from this tag

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0

      - uses: gradle/actions/setup-gradle@v6

      - name: Validate tag
        id: tag
        run: |
          tag="$GITHUB_REF_NAME"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error title=Invalid tag::'$tag' is not vX.Y.Z (an optional -suffix is allowed); nothing was published."
            exit 1
          fi
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          if [[ "$tag" == v*-* ]]; then echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else echo "prerelease=false" >> "$GITHUB_OUTPUT"; fi

      - name: Build library, example app and run unit tests
        run: |
          set -o pipefail
          ./gradlew :soniq-base:assembleRelease :examples:youtube-music:assembleRelease \
              :soniq-base:testDebugUnitTest --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Check the derived version matches the tag
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          derived="$(./gradlew -q :soniq-base:properties --no-daemon | awk -F': ' '/^version:/ { print $2 }')"
          echo "version from build: $derived"
          if [[ "$derived" != "$VERSION" ]]; then
            echo "::error title=Version mismatch::Build reports '$derived' for tag v$VERSION."
            exit 1
          fi

      - name: Release notes
        id: notes
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set +e
          python3 scripts/release.py "$VERSION" --print-body > body.md
          code=$?
          set -e
          case "$code" in
            0) echo "generated=false" >> "$GITHUB_OUTPUT" ;;
            3) echo "generated=true" >> "$GITHUB_OUTPUT"
               echo "::warning::CHANGELOG.md has no [$VERSION] section; the release will use auto-generated notes." ;;
            *) exit "$code" ;;
          esac

      - name: Surface Gradle errors as annotations
        if: failure()
        run: |
          {
            grep -hE '^e: |What went wrong|Execution failed|Caused by|error:|: Error: |: Fatal: |FAILURE:' build.log 2>/dev/null || true
            grep -h -A12 'What went wrong' build.log 2>/dev/null || true
          } | head -60 | while IFS= read -r line; do echo "::error title=gradle::$line"; done

      - name: Publish :soniq-base to GitHub Packages
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :soniq-base:publish --no-daemon --stacktrace

      - name: Create or update the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.tag.outputs.version }}
          PRERELEASE: ${{ steps.tag.outputs.prerelease }}
          GENERATED: ${{ steps.notes.outputs.generated }}
        run: |
          # AGP puts the AAR under build/outputs/aar but the sources JAR elsewhere
          # under build/, so search the whole build directory.
          assets=()
          while IFS= read -r file; do assets+=("$file"); done < <(
            find soniq-base/build \( -name '*.aar' -o -name '*sources*.jar' \);
            find examples/youtube-music/build/outputs/apk/release -name '*.apk')
          echo "artifacts in build:"; find soniq-base/build \( -name '*.jar' -o -name '*.aar' \) | sort
          if [[ " ${assets[*]} " != *sources* ]]; then
            echo "::warning::No sources JAR found under soniq-base/build; the GitHub Release will lack it (Maven consumers still get it)."
          fi
          echo "assets: ${assets[*]}"
          prerelease_flag=(); [[ "$PRERELEASE" == "true" ]] && prerelease_flag=(--prerelease)
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Release drafted in the GitHub UI (which pushed the tag): add the assets.
            gh release upload "$TAG" "${assets[@]}" --clobber
            if [[ -z "$(gh release view "$TAG" --json body -q .body | tr -d '[:space:]')" ]]; then
              if [[ "$GENERATED" == "true" ]]; then
                gh release edit "$TAG" --generate-notes
              else
                gh release edit "$TAG" --notes-file body.md
              fi
            fi
          else
            if [[ "$GENERATED" == "true" ]]; then
              gh release create "$TAG" "${assets[@]}" --verify-tag --title "Soniq Base $VERSION" \
                  --generate-notes "${prerelease_flag[@]}"
            else
              gh release create "$TAG" "${assets[@]}" --verify-tag --title "Soniq Base $VERSION" \
                  --notes-file body.md "${prerelease_flag[@]}"
            fi
          fi
          gh release view "$TAG" --json url -q .url
